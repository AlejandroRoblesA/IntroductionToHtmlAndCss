<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion Component</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        color: #343a40;
        line-height: 1;
        display: flex;
        justify-content: center;
      }

      div {
        width: 420px;
        margin-top: 200px;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      a:link,
      a:visited {
        height: 32px;
        width: 32px;
        color: black;
        text-decoration: none;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      a:hover,
      a:active {
        background-color: #087f5b;
        color: #fff;
        cursor: pointer;
      }

      span {
        height: 24px;
        width: 20px;
        display: flex;
        align-items: end;
        justify-content: center;
      }

      button {
        color: #087f5b;
        background: none;
        font-weight: 500;
        text-align: center;
        border: 1px solid #087f5b;
        border-radius: 50%;
        cursor: pointer;
        position: absolute;
      }

      button:hover {
        border: none;
        color: #fff;
        background-color: #087f5b;
      }

      .btn {
        height: 40px;
        width: 40px;
        stroke: #087f5b;
      }

      .btn--left {
        left: 0;
      }

      .btn--right {
        right: 0;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div>
      <a href="#">1</a>
      <a href="#">2</a>
      <a href="#">3</a>
      <a href="#">4</a>
      <a href="#">5</a>
      <a href="#">6</a>
      <span>...</span>
      <a href="#">23</a>
      <button class="btn btn--left">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="btn-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
          />
        </svg>
      </button>

      <button class="btn btn--right">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="btn-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
